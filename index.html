<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A7B54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pemasukan">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Buku Pemasukan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1ED; --paper:#FFFFFF; --ink:#1C2B3A; --muted:#5B6B75; --rule:#D2DDD7; --soft:#F4F8F6;
  --yucho:#0A7B54; --paypay:#D6283A; --idr:#2C5BA6; --hanko:#C62E3A; --accent:#0A7B54; --on-accent:#FFFFFF;
  --shadow:0 1px 0 rgba(28,43,58,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1719; --paper:#162124; --ink:#E4EDE9; --muted:#95A8AC; --rule:#28393D; --soft:#1B282B;
    --yucho:#3DBE8C; --paypay:#FF6F7C; --idr:#86AAEA; --hanko:#FF5C66; --accent:#3DBE8C; --on-accent:#0F1719;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1719; --paper:#162124; --ink:#E4EDE9; --muted:#95A8AC; --rule:#28393D; --soft:#1B282B;
  --yucho:#3DBE8C; --paypay:#FF6F7C; --idr:#86AAEA; --hanko:#FF5C66; --accent:#3DBE8C; --on-accent:#0F1719;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 10px}
.brand{font-weight:900;font-size:1.05rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand .seal{width:26px;height:26px;border-radius:50%;border:2px solid var(--hanko);color:var(--hanko);
  display:grid;place-items:center;font-size:.72rem;font-weight:900;line-height:1}
.mode{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.mode.local i{background:#D69A1E}

.month{display:flex;align-items:center;justify-content:space-between;background:var(--paper);
  border:1px solid var(--rule);border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.month button{border:0;background:transparent;width:44px;height:40px;border-radius:9px;font-size:1.25rem}
.month button:active{background:var(--soft)}
.month strong{font-weight:700}

/* Passbook hero */
.book{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.book-head{padding:18px 18px 14px;border-bottom:3px double var(--rule)}
.book-head .lbl{color:var(--muted);font-size:.85rem}
.big{font-size:clamp(2.1rem,9vw,2.9rem);font-weight:900;line-height:1.1;letter-spacing:-.01em;margin-top:2px;word-break:break-all}
.lines{display:grid}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 18px;border-bottom:1px solid var(--rule)}
.line:last-child{border-bottom:0}
.line span{color:var(--muted);font-size:.9rem}
.line b{font-weight:700;text-align:right}
.line.total{background:var(--soft)}
.line.total b{font-size:1.1rem}
.line small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}

h2{font-size:1rem;font-weight:700;margin:26px 0 10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.chart{padding:14px 14px 8px;color:var(--accent)}
.chart svg{display:block;width:100%;height:84px}
.chart .axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}

.acc-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.acc-row:last-child{border-bottom:0}
.acc-name{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.acc-name em{font-style:normal;color:var(--muted);font-size:.8rem;font-weight:400}
.acc-amt{font-weight:700;text-align:right}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.t-yucho{--c:var(--yucho)} .t-paypay{--c:var(--paypay)} .t-idr{--c:var(--idr)}
.dot,.bar i{background:var(--c)}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px}

/* Ledger */
.ledger-day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:.85rem;color:var(--muted)}
.ledger-day b{color:var(--ink);font-weight:700}
.row{width:100%;display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;text-align:left;
  background:var(--paper);border:0;border-bottom:1px solid var(--rule);padding:12px 14px 12px 0}
.ledger{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--paper)}
.ledger .row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.row .strip{align-self:stretch;background:var(--c)}
.row .who{min-width:0}
.row .who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field > label,.field > .lab{font-size:.85rem;font-weight:700}
.hint{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;min-height:46px;
  font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

.accs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acc-btn{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:10px;border:1px solid var(--rule);
  background:var(--paper);text-align:left;min-height:46px;min-width:0}
.acc-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.acc-btn[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--soft);font-weight:700}
.grp{font-size:.75rem;color:var(--muted);margin:10px 0 6px}
.grp:first-child{margin-top:0}

.amount{display:flex;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
.amount:focus-within{outline:2px solid var(--accent)}
.amount .cur{font-size:1.5rem;font-weight:900;color:var(--muted);margin-right:6px}
.amount input{border:0;outline:0 !important;font-size:1.9rem;font-weight:900;padding:10px 0;min-height:64px;background:transparent}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--rule);
  background:var(--paper);padding:12px 16px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);width:100%;font-size:1.05rem;min-height:54px}
.btn.danger{color:var(--hanko);border-color:var(--hanko)}
.btn.danger.armed{background:var(--hanko);color:#fff}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:grid;gap:8px}

.set-acc{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:8px}
.set-acc .cur{font-size:.8rem;color:var(--muted);width:34px;text-align:right}
.note{font-size:.85rem;color:var(--muted);background:var(--soft);border:1px solid var(--rule);border-radius:10px;padding:12px}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.tab{border:0;background:transparent;padding:8px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab.add{color:var(--ink)}
.tab.add .plus{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-22px;border:4px solid var(--paper)}
.tab.add .plus svg{width:26px;height:26px}

/* Hanko stamp confirmation */
.stamp{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;opacity:0}
.stamp.show{animation:fade 1.2s ease forwards}
.stamp .seal{width:150px;height:150px;border-radius:50%;border:5px solid var(--hanko);color:var(--hanko);
  display:grid;place-items:center;text-align:center;background:color-mix(in srgb,var(--paper) 88%,transparent);
  transform:rotate(-12deg) scale(1.7)}
.stamp.show .seal{animation:press .38s cubic-bezier(.2,.9,.3,1.3) forwards}
.stamp .seal b{font-size:2.6rem;font-weight:900;line-height:1;display:block;letter-spacing:.06em}
.stamp .seal small{display:block;font-weight:700;font-size:.8rem;margin-top:6px}
@keyframes press{to{transform:rotate(-12deg) scale(1)}}
@keyframes fade{0%{opacity:0}8%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .stamp.show .seal{animation:none;transform:rotate(-12deg) scale(1)}
}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.splash{min-height:60vh;display:grid;place-items:center;color:var(--muted);text-align:center}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="seal" aria-hidden="true">入</span>Buku Pemasukan</div>
    <div class="mode" id="mode"></div>
  </header>
  <main id="view"><div class="splash">Menyiapkan buku kas…</div></main>
</div>

<nav class="tabs" aria-label="Menu">
  <div class="in">
    <button class="tab" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      Ringkasan</button>
    <button class="tab add" data-tab="add">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      Catat</button>
    <button class="tab" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>
      Riwayat</button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Pengaturan</button>
  </div>
</nav>

<div class="stamp" id="stamp" aria-hidden="true"><div class="seal"><div><b>入金</b><small id="stampTxt">Tersimpan</small></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="restoreFile" accept=".json,application/json" class="hidden">

<script>
(function(){
"use strict";

/* ---------- defaults ---------- */
var DEFAULT_ACCOUNTS = [];
for (var i=1;i<=10;i++) DEFAULT_ACCOUNTS.push({id:'yucho'+i, name:'Yucho '+i, type:'yucho', currency:'JPY'});
DEFAULT_ACCOUNTS.push({id:'paypay', name:'PayPay', type:'paypay', currency:'JPY'});
DEFAULT_ACCOUNTS.push({id:'idr', name:'Rekening Indonesia', type:'idr', currency:'IDR'});
var DEFAULT_CFG = {accounts:DEFAULT_ACCOUNTS, rate:108, sources:['Penjualan','Ongkir','DP / Pre-order','Lainnya']};

/* ---------- helpers ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return (n<10?'0':'')+n}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n,cur){n=Math.round(n||0);return cur==='IDR' ? 'Rp '+n.toLocaleString('id-ID') : '¥'+n.toLocaleString('ja-JP')}
function fmtNum(n,cur){return Math.round(n||0).toLocaleString(cur==='IDR'?'id-ID':'ja-JP')}
function monthLabel(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}
function dayLabel(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})}
function shiftMonth(m,k){var p=m.split('-'),d=new Date(+p[0],+p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function daysIn(m){var p=m.split('-');return new Date(+p[0],+p[1],0).getDate()}
function $(id){return document.getElementById(id)}
var LS={get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
        set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- state ---------- */
var S={mode:null, cfg:clone(DEFAULT_CFG), month:today().slice(0,7), days:{}, tab:'home',
  filterAcc:'all', q:'', form:null, busy:false};
var local={days:{}};

function accById(id){for(var i=0;i<S.cfg.accounts.length;i++) if(S.cfg.accounts[i].id===id) return S.cfg.accounts[i];return null}
function rate(){var r=Number(S.cfg.rate);return r>0?r:108}
function toJPY(e){return e.currency==='IDR' ? e.amount/rate() : e.amount}
function normCfg(c){
  var out=clone(DEFAULT_CFG); if(!c) return out;
  if(Array.isArray(c.accounts)) out.accounts=DEFAULT_ACCOUNTS.map(function(d){
    var f=c.accounts.filter(function(a){return a&&a.id===d.id})[0];
    return {id:d.id,type:d.type,currency:d.currency,name:(f&&f.name)||d.name};
  });
  if(Number(c.rate)>0) out.rate=Number(c.rate);
  if(Array.isArray(c.sources)&&c.sources.length) out.sources=c.sources.filter(Boolean);
  return out;
}
function monthEntries(){
  var out=[];
  Object.keys(S.days).forEach(function(d){
    var m=S.days[d]||{};
    Object.keys(m).forEach(function(id){var e=m[id]; if(e&&!e.deleted&&e.date===d) out.push(e)});
  });
  out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)});
  return out;
}

/* ---------- storage: local ---------- */
function loadLocal(){
  local=LS.get('bp.data')||{days:{}}; if(!local.days) local.days={};
  S.cfg=normCfg(LS.get('bp.cfg'));
}
function saveLocal(){ if(!LS.set('bp.data',local)) toast('Penyimpanan HP penuh. Cadangkan lalu kosongkan ruang.') }
function localMonth(){
  var d={}; Object.keys(local.days).forEach(function(k){ if(k.slice(0,7)===S.month) d[k]=local.days[k] }); S.days=d;
}

/* ---------- store API ---------- */
var store={
  put: async function(entry){
    (local.days[entry.date]=local.days[entry.date]||{})[entry.id]=entry; saveLocal(); localMonth();
  },
  saveCfg: async function(cfg){ LS.set('bp.cfg',cfg); S.cfg=normCfg(cfg) },
  setMonth: function(m){ S.month=m; localMonth(); refresh() },
  allDays: async function(){ return clone(local.days) }
};

/* ---------- ui helpers ---------- */
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2600)}
function stamp(txt){var s=$('stamp');$('stampTxt').textContent=txt||'Tersimpan';s.classList.remove('show');void s.offsetWidth;s.classList.add('show')}
function errMsg(e){
  var c=e&&e.code;
  if(c==='invalid_argument') return 'Tidak bisa menyimpan. Akun ini mungkin hanya punya akses lihat.';
  if(c==='quota_exceeded') return 'Kapasitas penyimpanan penuh. Cadangkan lalu hapus data lama.';
  if(c==='resource_exhausted') return 'Terlalu banyak permintaan. Coba lagi sebentar lagi.';
  return 'Gagal menyimpan. Periksa koneksi internet lalu coba lagi.';
}
function modeBadge(){
  var m=$('mode'); m.className='mode';
  m.textContent=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function monthBar(){
  return '<div class="month"><button data-act="prev" aria-label="Bulan sebelumnya">‹</button><strong>'+esc(monthLabel(S.month))+
    '</strong><button data-act="next" aria-label="Bulan berikutnya">›</button></div>';
}

/* ---------- views ---------- */
function viewHome(){
  var es=monthEntries(), jpy=0, idr=0, per={}, dayTot={};
  es.forEach(function(e){
    if(e.currency==='IDR') idr+=e.amount; else jpy+=e.amount;
    per[e.account]=per[e.account]||{amt:0,n:0,jp:0}; per[e.account].amt+=e.amount; per[e.account].n++; per[e.account].jp+=toJPY(e);
    var dd=+e.date.slice(8,10); dayTot[dd]=(dayTot[dd]||0)+toJPY(e);
  });
  var idrJ=idr/rate(), tDay=today(), todayJ=0, todayI=0;
  es.forEach(function(e){ if(e.date===tDay){ if(e.currency==='IDR') todayI+=e.amount; else todayJ+=e.amount } });

  var h=monthBar();
  h+='<section class="book" aria-label="Ringkasan bulan">'+
     '<div class="book-head"><div class="lbl">Pemasukan dalam Yen</div><div class="big">'+fmt(jpy,'JPY')+'</div></div>'+
     '<div class="lines">'+
       '<div class="line"><span>Pemasukan dalam Rupiah</span><b>'+fmt(idr,'IDR')+'</b></div>'+
       '<div class="line total"><span>Total gabungan</span><b>≈ '+fmt(jpy+idrJ,'JPY')+'<small>kurs 1 ¥ = Rp '+fmtNum(rate(),'IDR')+'</small></b></div>'+
       (S.month===tDay.slice(0,7)?'<div class="line"><span>Hari ini</span><b>'+fmt(todayJ,'JPY')+(todayI?' + '+fmt(todayI,'IDR'):'')+'</b></div>':'')+
       '<div class="line"><span>Jumlah transaksi</span><b>'+es.length+'</b></div>'+
     '</div></section>';

  var lb=LS.get('bp.lastBackup'), hasData=Object.keys(local.days).length>0;
  if(hasData&&(!lb||Date.now()-lb>14*864e5))
    h+='<div class="note" style="margin-top:14px">Data hanya ada di HP ini. '+(lb?'Cadangan terakhir '+Math.floor((Date.now()-lb)/864e5)+' hari lalu.':'Belum pernah dicadangkan.')+
       ' <button class="btn" data-act="backup" style="margin-top:8px;width:100%">Cadangkan sekarang</button></div>';
  if(!es.length){
    h+='<div class="card empty" style="margin-top:14px">Belum ada pemasukan di bulan ini.<br><button class="btn" data-tab="add">Catat pemasukan pertama</button></div>';
    return h;
  }
  // chart
  var N=daysIn(S.month), max=0; for(var d=1;d<=N;d++) max=Math.max(max,dayTot[d]||0);
  var bars=''; for(d=1;d<=N;d++){var v=dayTot[d]||0,hh=max?Math.max(v?2:0,v/max*70):0;
    bars+='<rect x="'+((d-1)*10+1.5)+'" y="'+(72-hh)+'" width="7" height="'+hh+'" rx="1.5" fill="currentColor" opacity="'+(v?1:0)+'"><title>'+d+': '+fmt(v,'JPY')+'</title></rect>'+
          '<rect x="'+((d-1)*10+1.5)+'" y="73" width="7" height="2" rx="1" fill="var(--rule)"/>'}
  h+='<h2>Pemasukan per hari (setara Yen)</h2><div class="card chart"><svg viewBox="0 0 '+(N*10)+' 76" preserveAspectRatio="none" role="img" aria-label="Grafik pemasukan harian">'+bars+
     '</svg><div class="axis"><span>1</span><span>'+Math.ceil(N/2)+'</span><span>'+N+'</span></div></div>';
  // per account
  var maxJ=0; Object.keys(per).forEach(function(k){maxJ=Math.max(maxJ,per[k].jp)});
  h+='<h2>Per rekening</h2><div class="card">';
  S.cfg.accounts.forEach(function(a){
    var p=per[a.id]; if(!p) return;
    h+='<div class="acc-row t-'+a.type+'"><div class="acc-name"><span class="dot"></span><span>'+esc(a.name)+'</span><em>'+p.n+' trx</em></div>'+
       '<div class="acc-amt">'+fmt(p.amt,a.currency)+'</div><div class="bar"><i style="width:'+(maxJ?p.jp/maxJ*100:0).toFixed(1)+'%"></i></div></div>';
  });
  h+='</div>';
  // latest
  h+='<h2>Terakhir dicatat</h2><div class="ledger">'+es.slice(0,5).map(rowHtml).join('')+'</div>';
  return h;
}
function rowHtml(e){
  var a=accById(e.account)||{name:e.account,type:'yucho'};
  var sub=[e.source,e.ref,e.note].filter(Boolean).join(', ');
  return '<button class="row t-'+a.type+'" data-edit="'+esc(e.id)+'" data-date="'+esc(e.date)+'"><span class="strip"></span>'+
    '<span class="who"><b>'+esc(a.name)+'</b><span>'+esc(sub||e.date)+'</span></span><span class="amt">'+fmt(e.amount,e.currency)+'</span></button>';
}
function viewList(){
  var opts='<option value="all">Semua rekening</option>'+S.cfg.accounts.map(function(a){return '<option value="'+a.id+'"'+(S.filterAcc===a.id?' selected':'')+'>'+esc(a.name)+'</option>'}).join('');
  return monthBar()+'<div class="filters"><select id="fAcc" aria-label="Saring rekening">'+opts+'</select>'+
    '<input type="search" id="fQ" placeholder="Cari catatan, pesanan" value="'+esc(S.q)+'" aria-label="Cari"></div><div id="listBody">'+listBody()+'</div>';
}
function listBody(){
  var q=S.q.trim().toLowerCase();
  var es=monthEntries().filter(function(e){
    if(S.filterAcc!=='all'&&e.account!==S.filterAcc) return false;
    if(q){var a=accById(e.account); var hay=[e.source,e.ref,e.note,a&&a.name,String(e.amount)].join(' ').toLowerCase(); if(hay.indexOf(q)<0) return false}
    return true;
  });
  if(!es.length) return '<div class="card empty">'+(monthEntries().length?'Tidak ada transaksi yang cocok dengan saringan ini.':'Belum ada pemasukan di bulan ini.')+'</div>';
  var jp=0,id=0; es.forEach(function(e){ if(e.currency==='IDR') id+=e.amount; else jp+=e.amount });
  var h='<div class="hint" style="margin:6px 4px 0">'+es.length+' transaksi, total '+fmt(jp,'JPY')+(id?' dan '+fmt(id,'IDR'):'')+'</div>';
  var groups={},order=[]; es.forEach(function(e){ if(!groups[e.date]){groups[e.date]=[];order.push(e.date)} groups[e.date].push(e) });
  order.forEach(function(d){
    var gj=0,gi=0; groups[d].forEach(function(e){ if(e.currency==='IDR') gi+=e.amount; else gj+=e.amount });
    h+='<div class="ledger-day"><span>'+esc(dayLabel(d))+'</span><b>'+(gj?fmt(gj,'JPY'):'')+(gj&&gi?' + ':'')+(gi?fmt(gi,'IDR'):'')+'</b></div>'+
       '<div class="ledger">'+groups[d].map(rowHtml).join('')+'</div>';
  });
  return h;
}
function newForm(){
  var last=LS.get('bp.lastAcc');
  return {id:null, origDate:null, date:today(), account:(last&&accById(last))?last:'', amount:'', source:S.cfg.sources[0]||'', ref:'', note:''};
}
function viewAdd(){
  var f=S.form||(S.form=newForm());
  var acc=accById(f.account), cur=acc?acc.currency:'JPY';
  function btn(a){return '<button class="acc-btn t-'+a.type+'" data-acc="'+a.id+'" aria-pressed="'+(f.account===a.id)+'"><span class="dot"></span><span>'+esc(a.name)+'</span></button>'}
  var y=S.cfg.accounts.filter(function(a){return a.type==='yucho'}), o=S.cfg.accounts.filter(function(a){return a.type!=='yucho'});
  var h='<h2 style="margin-top:4px">'+(f.id?'Ubah pemasukan':'Catat pemasukan')+'</h2>';
  h+='<div class="field"><div class="lab">Masuk ke rekening</div><div><div class="grp">Yucho</div><div class="accs">'+y.map(btn).join('')+
     '</div><div class="grp">Lainnya</div><div class="accs">'+o.map(btn).join('')+'</div></div></div>';
  h+='<div class="field"><label for="amt">Jumlah</label><div class="amount"><span class="cur" id="curSym">'+(cur==='IDR'?'Rp':'¥')+'</span>'+
     '<input id="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="'+esc(f.amount?fmtNum(+f.amount,cur):'')+'"></div>'+
     '<div class="hint" id="amtHint">'+(acc?(cur==='IDR'?'Dalam Rupiah':'Dalam Yen'):'Pilih rekening dulu')+'</div></div>';
  h+='<div class="field"><label for="dt">Tanggal masuk</label><input id="dt" type="date" value="'+esc(f.date)+'"></div>';
  h+='<div class="field"><div class="lab">Sumber</div><div class="chips">'+S.cfg.sources.map(function(s){return '<button class="chip" data-src="'+esc(s)+'" aria-pressed="'+(f.source===s)+'">'+esc(s)+'</button>'}).join('')+'</div></div>';
  h+='<div class="field"><label for="ref">No. pesanan atau nama pembeli</label><input id="ref" type="text" autocomplete="off" value="'+esc(f.ref)+'" placeholder="Opsional"></div>';
  h+='<div class="field"><label for="nt">Catatan</label><input id="nt" type="text" autocomplete="off" value="'+esc(f.note)+'" placeholder="Opsional"></div>';
  h+='<div class="stack"><button class="btn primary" data-act="save">'+(f.id?'Simpan perubahan':'Simpan pemasukan')+'</button>';
  if(f.id) h+='<div class="btns"><button class="btn" data-act="cancel">Batal</button><button class="btn danger" data-act="del">Hapus</button></div>';
  h+='</div>';
  return h;
}
function viewSettings(){
  var h='<h2 style="margin-top:4px">Nama rekening</h2><div class="card" style="padding:14px">';
  S.cfg.accounts.forEach(function(a){
    h+='<div class="set-acc t-'+a.type+'"><span class="dot"></span><input type="text" data-name="'+a.id+'" value="'+esc(a.name)+'" aria-label="Nama '+esc(a.name)+'"><span class="cur">'+(a.currency==='IDR'?'IDR':'JPY')+'</span></div>';
  });
  h+='<div class="hint" style="margin-bottom:12px">Contoh: "Yucho 3 (a.n. Sari)". Mata uang tiap rekening tetap.</div>';
  h+='<div class="field"><label for="rate">Kurs: 1 Yen = berapa Rupiah</label><input id="rate" type="number" inputmode="decimal" min="1" step="0.01" value="'+esc(S.cfg.rate)+'">'+
     '<div class="hint">Dipakai untuk menghitung total gabungan saja. Jumlah asli tidak berubah.</div></div>';
  h+='<div class="field"><label for="srcs">Pilihan sumber pemasukan</label><textarea id="srcs">'+esc(S.cfg.sources.join('\n'))+'</textarea><div class="hint">Satu pilihan per baris.</div></div>';
  h+='<button class="btn primary" data-act="saveCfg">Simpan pengaturan</button></div>';

  h+='<h2>Ekspor ke Excel</h2><div class="stack">'+
     '<button class="btn" data-act="csvMonth">Unduh CSV '+esc(monthLabel(S.month))+'</button>'+
     '<button class="btn" data-act="csvAll">Unduh CSV semua data</button></div>'+
     '<div class="hint" style="margin-top:6px">File CSV bisa langsung dibuka di Excel atau Google Sheets.</div>';

  h+='<h2>Cadangan</h2><div class="btns"><button class="btn" data-act="backup">Cadangkan</button><button class="btn" data-act="restore">Pulihkan</button></div>'+
     '<div class="hint" style="margin-top:6px">Pulihkan menggabungkan isi file cadangan dengan data yang ada; tidak ada yang terhapus.</div>';

  h+='<h2>Penyimpanan</h2><div class="note">Data tersimpan di HP ini saja dan tetap bisa dipakai tanpa internet. '+
     'Kalau aplikasi dihapus atau HP rusak, data ikut hilang. Tekan Cadangkan secara rutin lalu simpan filenya ke Google Drive, LINE, atau email. '+
     'Untuk pindah ke HP baru, pasang aplikasinya lalu tekan Pulihkan dan pilih file cadangan terakhir.</div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  modeBadge();
  var v=$('view');
  if(S.tab==='home') v.innerHTML=viewHome();
  else if(S.tab==='list') v.innerHTML=viewList();
  else if(S.tab==='add') v.innerHTML=viewAdd();
  else v.innerHTML=viewSettings();
  document.querySelectorAll('.tab').forEach(function(t){ if(t.dataset.tab===S.tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current') });
}
// data changed: don't wipe forms the person is typing in
function refresh(){
  if(!S.mode) return;
  if(S.tab==='add'||S.tab==='settings'){ modeBadge(); return }
  if(S.tab==='list'){ var b=$('listBody'); if(b){ b.innerHTML=listBody(); return } }
  render();
}
function go(tab){
  if(tab==='add'&&S.tab!=='add'&&!(S.form&&S.form.id)) S.form=null;
  if(tab!=='add'&&S.form&&S.form.id) S.form=null;
  S.tab=tab; render(); window.scrollTo(0,0);
}

/* ---------- actions ---------- */
function readForm(){
  var f=S.form; if(!f) return;
  var a=$('amt'),d=$('dt'),r=$('ref'),n=$('nt');
  if(a) f.amount=a.value.replace(/\D/g,''); if(d) f.date=d.value; if(r) f.ref=r.value; if(n) f.note=n.value;
}
async function saveEntry(){
  readForm(); var f=S.form, acc=accById(f.account);
  if(!acc) return toast('Pilih rekening tujuan dulu.');
  var amt=parseInt(f.amount,10); if(!(amt>0)) { toast('Isi jumlah pemasukan.'); var ai=$('amt'); if(ai) ai.focus(); return }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return toast('Isi tanggal masuk.');
  if(S.busy) return; S.busy=true;
  var editing=!!f.id;
  var entry={id:f.id||uid(), date:f.date, account:acc.id, currency:acc.currency, amount:amt,
    source:f.source||'', ref:(f.ref||'').trim(), note:(f.note||'').trim(), createdAt:f.createdAt||Date.now(), updatedAt:Date.now(), deleted:false};
  try{
    await store.put(entry);
    if(editing&&f.origDate&&f.origDate!==f.date){ var old=clone(entry); old.date=f.origDate; old.deleted=true; await store.put(old) }
    LS.set('bp.lastAcc',acc.id);
    stamp(editing?'Diperbarui':'Tersimpan');
    if(editing){ S.form=null; S.tab='list'; if(entry.date.slice(0,7)!==S.month) store.setMonth(entry.date.slice(0,7)); render() }
    else {
      S.form={id:null,origDate:null,date:f.date,account:acc.id,amount:'',source:f.source,ref:'',note:''};
      if(entry.date.slice(0,7)!==S.month) store.setMonth(entry.date.slice(0,7));
      render(); var ai2=$('amt'); if(ai2) ai2.focus({preventScroll:true});
    }
    if(S.mode==='local') refresh();
  }catch(e){ toast(errMsg(e)) }
  S.busy=false;
}
var delArmed=null;
async function deleteEntry(btn){
  if(delArmed!==btn){ delArmed=btn; btn.classList.add('armed'); btn.textContent='Tekan lagi untuk hapus';
    setTimeout(function(){ if(delArmed===btn){ delArmed=null; btn.classList.remove('armed'); btn.textContent='Hapus' } },3000); return }
  delArmed=null; var f=S.form; if(!f||!f.id) return;
  var src=(S.days[f.origDate]||{})[f.id]; var e=src?clone(src):{id:f.id,date:f.origDate};
  e.deleted=true; e.updatedAt=Date.now(); e.date=f.origDate;
  try{ await store.put(e); S.form=null; S.tab='list'; render(); toast('Pemasukan dihapus.') }catch(err){ toast(errMsg(err)) }
}
function openEdit(id,date){
  var e=(S.days[date]||{})[id]; if(!e) return;
  S.form={id:e.id,origDate:e.date,date:e.date,account:e.account,amount:String(e.amount),source:e.source||'',ref:e.ref||'',note:e.note||'',createdAt:e.createdAt};
  S.tab='add'; render(); window.scrollTo(0,0);
}
async function saveCfg(){
  var cfg=clone(S.cfg);
  document.querySelectorAll('[data-name]').forEach(function(inp){
    cfg.accounts.forEach(function(a){ if(a.id===inp.dataset.name) a.name=inp.value.trim()||a.name })
  });
  var r=parseFloat(($('rate')||{}).value); if(r>0) cfg.rate=r;
  var s=(($('srcs')||{}).value||'').split('\n').map(function(x){return x.trim()}).filter(Boolean); if(s.length) cfg.sources=s;
  try{ await store.saveCfg(cfg); S.cfg=normCfg(cfg); render(); stamp('Pengaturan') }catch(e){ toast(errMsg(e)) }
}

/* ---------- export / backup ---------- */
async function offerFile(filename,data){
  var type=filename.endsWith('.csv')?'text/csv':'application/json';
  try{
    var file=new File([data],filename,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return true }
    var a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href)},4000); return true;
  }catch(e){ if(e&&e.name==='AbortError') return false; toast('File tidak bisa dibagikan. Coba lagi.'); return false }
}
function csvCell(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(entries){
  var rows=[['Tanggal','Rekening','Mata uang','Jumlah','Sumber','No. pesanan / pembeli','Catatan']];
  entries.forEach(function(e){var a=accById(e.account);rows.push([e.date,a?a.name:e.account,e.currency,e.amount,e.source,e.ref,e.note])});
  return '\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function flatten(days){
  var out=[]; Object.keys(days).forEach(function(d){ var m=days[d]||{}; Object.keys(m).forEach(function(k){ var e=m[k]; if(e&&!e.deleted&&e.date===d) out.push(e) }) });
  out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0)}); return out;
}
async function csvMonth(){ var es=monthEntries().slice().reverse(); if(!es.length) return toast('Belum ada data di bulan ini.'); offerFile('pemasukan-'+S.month+'.csv',toCSV(es)) }
async function csvAll(){ try{ var es=flatten(await store.allDays()); if(!es.length) return toast('Belum ada data.'); offerFile('pemasukan-semua-'+today()+'.csv',toCSV(es)) }catch(e){ toast(errMsg(e)) } }
async function backup(){
  var days=await store.allDays();
  var ok=await offerFile('cadangan-pemasukan-'+today()+'.json',JSON.stringify({app:'buku-pemasukan',version:1,cfg:S.cfg,days:days}));
  if(ok){ LS.set('bp.lastBackup',Date.now()); if(S.tab==='home') render() }
}
async function restore(file){
  try{
    var data=JSON.parse(await file.text()); if(!data||!data.days) throw new Error('bad');
    var n=0;
    for(var d of Object.keys(data.days)){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
      var m=data.days[d]||{};
      for(var id of Object.keys(m)){ var e=m[id]; if(!e||!e.id||!(e.amount>0)) continue; await store.put(e); if(!e.deleted) n++ }
    }
    if(data.cfg) await store.saveCfg(normCfg(data.cfg));
    store.setMonth(S.month); toast(n+' transaksi dipulihkan.'); render();
  }catch(e){ toast(e&&e.code?errMsg(e):'File cadangan tidak dikenali.') }
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab); return }
  if(t.dataset.edit){ openEdit(t.dataset.edit,t.dataset.date); return }
  if(t.dataset.acc){ readForm(); S.form.account=t.dataset.acc;
    document.querySelectorAll('[data-acc]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});
    var acc=accById(t.dataset.acc); $('curSym').textContent=acc.currency==='IDR'?'Rp':'¥';
    $('amtHint').textContent=acc.currency==='IDR'?'Dalam Rupiah':'Dalam Yen';
    var ai=$('amt'); if(S.form.amount) ai.value=fmtNum(+S.form.amount,acc.currency); ai.focus({preventScroll:true}); return }
  if(t.dataset.src!==undefined){ S.form.source=t.dataset.src; document.querySelectorAll('[data-src]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))}); return }
  var act=t.dataset.act;
  if(act==='prev') store.setMonth(shiftMonth(S.month,-1));
  else if(act==='next') store.setMonth(shiftMonth(S.month,1));
  else if(act==='save') saveEntry();
  else if(act==='cancel'){ S.form=null; go('list') }
  else if(act==='del') deleteEntry(t);
  else if(act==='saveCfg') saveCfg();
  else if(act==='csvMonth') csvMonth();
  else if(act==='csvAll') csvAll();
  else if(act==='backup') backup();
  else if(act==='restore') $('restoreFile').click();
  if(act==='prev'||act==='next'){ if(S.tab==='home'||S.tab==='list'||S.tab==='settings') render() }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='amt'){ var acc=accById(S.form&&S.form.account), raw=t.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,13);
    S.form.amount=raw; t.value=raw?fmtNum(+raw,acc?acc.currency:'JPY'):'' }
  else if(t.id==='fQ'){ S.q=t.value; $('listBody').innerHTML=listBody() }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='fAcc'){ S.filterAcc=t.value; $('listBody').innerHTML=listBody() }
  else if(t.id==='restoreFile'&&t.files&&t.files[0]){ restore(t.files[0]); t.value='' }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'&&S.tab==='add'&&ev.target.tagName==='INPUT'){ ev.preventDefault(); saveEntry() }
});

/* ---------- start ---------- */
(function init(){
  S.mode='local'; loadLocal(); localMonth(); render();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
  if('serviceWorker' in navigator) window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}) });
})();
})();
</script>
</body>
</html>
